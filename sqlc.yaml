version: "2"
sql:
  - engine: "postgresql"
    queries: "database/queries/query.sql"
    schema: "database/migrations/"
    gen:
      go:
        package: "repositories"
        out: "backend/repositories"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
